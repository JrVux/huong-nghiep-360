name: Deploy HuongNghiep360 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate app directory
        id: locate
        run: |
          if [ -f "huong-nghiep-app/package.json" ]; then
            echo "app_dir=huong-nghiep-app" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Could not find package.json at repo root or in huong-nghiep-app/" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm ci

      - name: Build site
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.app_dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
